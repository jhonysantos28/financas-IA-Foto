<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
     <script src=" https://js.puter.com/v2/ "></script>
    <title>Gasto foto</title>
</head>
<body>
    <div class="topo"> 
        <h1>🧾 Meu Controle Financeiro</h1>
        <p>Fotografe o comprovante. A IA anota pra você.</p> 
    </div>
        
        <div class="resumo">
      
        <div class="caixa-total">
            <p>💰 Total gasto</p>
            <h2 class="total-gasto">R$ 0,00</h2>
        </div>

        <div class="caixa-total">
            <p>🧾 Comprovantes</p>
            <h2 class="lidos">0</h2>
        </div>

          <div class="caixa-total">
        <p>📅 Mês atual</p>
        <h2 class="mes-atual"></h2>
    </div>
    
    </div>
      <div class="categorias">

    <h3>Gastos por categoria</h3>

    <p>Mercado: <strong class="mercado">R$ 0,00</strong></p>

    <p>Transporte: <strong class="transporte">R$ 0,00</strong></p>

    <p>Comida: <strong class="comida">R$ 0,00</strong></p>

    <p>Saúde: <strong class="saude">R$ 0,00</strong></p>

    <p>Lazer: <strong class="lazer">R$ 0,00</strong></p>

    <p>Casa: <strong class="casa">R$ 0,00</strong></p>

    <p>Outros: <strong class="outros">R$ 0,00</strong></p>

    </div>

   

    <!--INPUT PARA SELECIONAR IMAGENS-->
    <label class="botao-foto"> 
             📷 Tirar foto do comprovante
        <input class="foto" onchange="lerfoto()" type="file" accept="image/*"
        capture="environment">

    </label>
     
    <button class="botao-voz" onclick="iniciarVoz()">
    🎙️ Falar gasto
    </button>

    <div class="texto-voz">

        
    </div>
    <div class="carregando">
    ⏳ Lendo comprovante...
    </div>

    <div class="lista-de-comprovantes">
        
       

    </div>
    
        
</body>

<script src="script.js"></script>
</html>
